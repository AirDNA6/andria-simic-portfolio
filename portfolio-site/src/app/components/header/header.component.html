<header class="header" [class.header--scrolled]="scrolled()">
  <div class="header__inner container">
    <a class="header__brand" href="#" (click)="scrollTo('hero'); $event.preventDefault()">
      <span class="header__brand-mark">AS</span>
      <span class="header__brand-text">Simić</span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      @for (link of content().navLinks; track link.id) {
        <button type="button" class="header__link" (click)="scrollTo(link.id)">
          {{ link.label }}
        </button>
      }
      <a class="header__cta" [href]="'mailto:' + content().email">{{ content().ui.getInTouch }}</a>
    </nav>

    <div class="header__actions">
      <div class="header__lang" role="group" [attr.aria-label]="toggleLangLabel()">
        <button
          type="button"
          class="header__lang-btn"
          [class.header__lang-btn--active]="lang() === 'en'"
          [attr.aria-pressed]="lang() === 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>
        <button
          type="button"
          class="header__lang-btn"
          [class.header__lang-btn--active]="lang() === 'srb'"
          [attr.aria-pressed]="lang() === 'srb'"
          (click)="setLanguage('srb')"
        >
          SRB
        </button>
      </div>

      <button
        type="button"
        class="header__toggle"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="content().ui.toggleNav"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

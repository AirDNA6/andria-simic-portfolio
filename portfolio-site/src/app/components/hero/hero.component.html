<section id="hero" class="hero">
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="hero__orb hero__orb--1" aria-hidden="true"></div>
  <div class="hero__orb hero__orb--2" aria-hidden="true"></div>

  <div class="container hero__content">
    <p class="hero__eyebrow" appRevealOnScroll>Available for impactful engineering roles</p>

    <h1 class="hero__title" appRevealOnScroll>
      <span class="hero__title-line">{{ portfolio.name }}</span>
      <span class="hero__title-accent">{{ portfolio.title }}</span>
    </h1>

    <p class="hero__tagline" appRevealOnScroll>{{ portfolio.tagline }}</p>

    <div class="hero__actions" appRevealOnScroll>
      <button type="button" class="btn btn--primary" (click)="scrollTo('journey')">
        View my journey
      </button>
      <a class="btn btn--ghost" [href]="portfolio.github" target="_blank" rel="noopener noreferrer">
        GitHub profile
      </a>
    </div>

    <div class="hero__stats" appRevealOnScroll>
      <div class="hero__stat">
        <span class="hero__stat-value">5+</span>
        <span class="hero__stat-label">Years in tech</span>
      </div>
      <div class="hero__stat">
        <span class="hero__stat-value">.NET</span>
        <span class="hero__stat-label">& Angular stack</span>
      </div>
      <div class="hero__stat">
        <span class="hero__stat-value">Belgrade</span>
        <span class="hero__stat-label">Based · Remote-ready</span>
      </div>
    </div>
  </div>

  <div class="hero__scroll" aria-hidden="true">
    <span>Scroll</span>
    <div class="hero__scroll-line"></div>
  </div>
</section>

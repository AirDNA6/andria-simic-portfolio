<section id="skills" class="skills section">
  <div class="container section__grid">
    <header class="section__head">
      <h2 class="section__title">{{ ui().title }}</h2>
      <p class="section__desc">{{ ui().desc }}</p>
    </header>

    <dl class="skills__list">
      @for (group of content().skillGroups; track group.label) {
        <div class="skills__row">
          <dt class="skills__label">{{ group.label }}</dt>
          <dd>
            <ul class="skills__items">
              @for (skill of group.items; track skill) {
                <li class="tag">{{ skill }}</li>
              }
            </ul>
          </dd>
        </div>
      }
    </dl>
  </div>
</section>

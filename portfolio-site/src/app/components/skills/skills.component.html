<section id="skills" class="skills section">
  <div class="container">
    <div class="section-header section-header--center" appRevealOnScroll>
      <span class="section-label">Technical arsenal</span>
      <h2 class="section-title">Stack & tooling</h2>
      <p class="section-desc">
        Production-grade technologies across backend, frontend, data, and cloud operations.
      </p>
    </div>

    <div class="skills__grid">
      @for (group of portfolio.skillGroups; track group.label) {
        <div class="skills__group" appRevealOnScroll>
          <h3 class="skills__group-label">{{ group.label }}</h3>
          <ul class="skills__list">
            @for (skill of group.items; track skill) {
              <li class="skills__chip">{{ skill }}</li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>

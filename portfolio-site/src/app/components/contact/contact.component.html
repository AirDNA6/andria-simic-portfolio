<section id="contact" class="contact section">
  <div class="container">
    <h2 class="contact__title">{{ ui().title }}</h2>
    <p class="contact__desc">{{ ui().desc }}</p>

    <div class="contact__email-row">
      <a class="contact__email hl tap-area"[href]="'mailto:' + content().email">{{ content().email }}</a>

      @if (canCopy) {
        <button type="button" class="contact__copy" [class.contact__copy--done]="copied()" (click)="copyEmail()">
          {{ copied() ? ui().copied : ui().copyEmail }}
        </button>
        <span class="visually-hidden" role="status">{{ copied() ? ui().copied : '' }}</span>
      }
    </div>

    <ul class="contact__details">
      <li>
        <a class="hl tap-area" [href]="content().github" target="_blank" rel="noopener noreferrer">github.com/AirDNA6</a>
      </li>
      <li>{{ content().location }}</li>
    </ul>
  </div>
</section>

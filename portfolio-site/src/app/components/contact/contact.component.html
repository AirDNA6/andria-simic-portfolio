<section id="contact" class="contact section">
  <div class="container">
    <div class="contact__panel" appRevealOnScroll>
      <div class="contact__glow" aria-hidden="true"></div>

      <div class="contact__content">
        <span class="section-label">{{ ui().label }}</span>
        <h2 class="contact__title">{{ ui().title }}</h2>
        <p class="contact__desc">{{ ui().desc }}</p>

        <div class="contact__links">
          <a class="contact__link contact__link--primary" [href]="'mailto:' + content().email">
            {{ content().email }}
          </a>
          <a
            class="contact__link"
            [href]="content().github"
            target="_blank"
            rel="noopener noreferrer"
          >
            github.com/AirDNA6
          </a>
          <span class="contact__link contact__link--muted">{{ content().location }}</span>
        </div>
      </div>
    </div>
  </div>
</section>

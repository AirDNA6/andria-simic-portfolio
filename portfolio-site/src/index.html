<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Andria Simić — Full Stack Developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Andria Simić — Full Stack Developer specializing in .NET, Angular, and cloud-native systems. Based in Belgrade."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Andria Simić — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full Stack Developer specializing in .NET, Angular, and real-time, event-driven systems. Based in Belgrade."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eceff3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
    />

    <!-- Light is the default; apply a saved dark choice before first paint to avoid a flash. -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('portfolio-theme') === 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0c1724');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
